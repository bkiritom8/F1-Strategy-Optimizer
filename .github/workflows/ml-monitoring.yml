name: ML Monitoring (Drift & Accuracy)

on:
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      race_id:
        description: 'Race ID for drift check, e.g. 2025_5 (optional)'
        required: false
        default: ''
      season:
        description: 'Season year for accuracy check, e.g. 2025 (optional, defaults to current year)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    name: Run ML Monitoring Job
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: docker/requirements-ml.txt

      - name: Authenticate to GCP
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: f1optimizer

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements-ml.txt
          pip install -e . || echo "Editable install failed, continuing with PYTHONPATH"

      - name: Build monitoring args
        id: args
        run: |
          ARGS="--log-to-cloud"
          if [ -n "${{ github.event.inputs.race_id }}" ]; then
            ARGS="$ARGS --race-id ${{ github.event.inputs.race_id }}"
          fi
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="$ARGS --season ${{ github.event.inputs.season }}"
          else
            ARGS="$ARGS --days 1"
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run Monitoring Job
        id: monitoring
        continue-on-error: true
        env:
          PROJECT_ID: 'f1optimizer'
          MODELS_BUCKET: 'f1optimizer-models'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ml/monitoring/run_monitoring.py ${{ steps.args.outputs.args }}

      - name: Trigger Retraining via Cloud Build
        if: steps.monitoring.outcome == 'failure'
        run: |
          echo "Drift or accuracy degradation detected - triggering retraining on pipeline branch"
          gcloud builds triggers run f1-api-docker-build \
            --region=us-central1 \
            --project=f1optimizer \
            --branch=pipeline

      - name: Fail job if monitoring detected issues
        if: steps.monitoring.outcome == 'failure'
        run: |
          echo "Monitoring flagged issues. Retraining has been triggered."
          exit 1
